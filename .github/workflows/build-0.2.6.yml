name: Build Sesame-AG 0.2.7 APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-0.2.6.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Sesame-AG 0.2.7 source
        uses: actions/checkout@v4
        with:
          repository: warthegd/Sesame-AG
          ref: 7f5aea12a39b6fd274743933099d5157476c727c
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: "17.0.1"
          architecture: x64
          cache: gradle

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -PappVersion=0.2.7 -PofficialSigningCertSha256="" assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Sesame-AG-0.2.7-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
